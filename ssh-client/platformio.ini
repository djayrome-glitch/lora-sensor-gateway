; Client SSH de poche pour LILYGO T-Deck / T-Deck Plus

[env:tdeck]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3FN16R8 : 16 Mo de flash, 8 Mo de PSRAM octale
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  ; libssh porté sur ESP32 (dernière version publiée)
  ewpa/LibSSH-ESP32
  bodmer/TFT_eSPI@^2.5.43

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; --- Configuration TFT_eSPI (écran ST7789 320x240 du T-Deck) ---
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=38
  -DTFT_MOSI=41
  -DTFT_SCLK=40
  -DTFT_CS=12
  -DTFT_DC=11
  -DTFT_RST=-1
  -DTFT_BL=42
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DSUPPORT_TRANSACTIONS=1
  ; Si les couleurs sont inversées (fond blanc au lieu de noir), décommente :
  ; -DTFT_INVERSION_ON=1
