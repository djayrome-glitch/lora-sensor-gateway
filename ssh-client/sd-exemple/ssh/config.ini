# Configuration du client SSH du T-Deck
# Copie le dossier "ssh" à la racine de la carte microSD (FAT32) : /ssh/config.ini
# Lignes commençant par # : commentaires.

# ---- Réseaux Wi-Fi (2,4 GHz uniquement) ----
# Le T-Deck se connecte au premier réseau connu à portée.
[wifi]
ssid = MaBox
password = motdepasse-wifi

[wifi]
ssid = Partage-telephone
password = motdepasse-partage

# ---- Serveurs ----
# [server Nom affiché]
#   host = adresse IP ou nom
#   port = 22 (facultatif)
#   user = utilisateur
#   key  = chemin de la clé privée sur la carte SD (facultatif)
# Sans "key", le mot de passe est demandé à chaque connexion (jamais enregistré).

[server Raspberry Pi]
host = 192.168.1.20
user = pi
key = /ssh/id_ed25519

[server Home Assistant]
host = 192.168.1.10
port = 22222
user = root
