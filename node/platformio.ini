; Nœuds capteurs LoRa pour Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; Un environnement par type de nœud :
;   pio run -e weather -t upload     station météo (BME280)
;   pio run -e mailbox -t upload     boîte aux lettres (contact reed)
;   pio run -e garden  -t upload     potager (humidité du sol + BME280 optionnel)

[env]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^7.1.0
  adafruit/Adafruit BME280 Library@^2.2.4
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I ../common

[env:weather]
build_flags = ${env.build_flags} -DNODE_TYPE=1

[env:mailbox]
build_flags = ${env.build_flags} -DNODE_TYPE=2

[env:garden]
build_flags = ${env.build_flags} -DNODE_TYPE=3
